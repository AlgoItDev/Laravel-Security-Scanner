name: Laravel Security Scan

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        type: string

env:
  TARGET_URL: ${{ vars.TARGET_URL || github.event.inputs.target_url || 'https://example.com' }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e .

      - name: Run scan
        run: |
          mkdir -p results
          python -m main "$TARGET_URL" --format sarif --format json --output ./results --fail-on medium --no-ssl-verify || echo "Scan completed"
          ls -la results/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results/scan_*.sarif.json
          category: laravel-security-scan

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: results/
          retention-days: 30

  report:
    needs: security-scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: reports

      - name: Summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "Target: $TARGET_URL" >> $GITHUB_STEP_SUMMARY
          ls -la reports/ >> $GITHUB_STEP_SUMMARY