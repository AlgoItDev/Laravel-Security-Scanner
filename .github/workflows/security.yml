name: Laravel Security Scan

on:
  push:
    branches: [main, develop, master]
    tags: ['v*']
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        type: string
      fail_on:
        description: 'Fail on severity level'
        required: false
        type: choice
        default: medium
        options:
          - critical
          - high
          - medium
          - low
          - info
          - none

env:
  TARGET_URL: ${{ vars.TARGET_URL || github.event.inputs.target_url || 'https://example.com' }}
  FAIL_ON: ${{ vars.FAIL_ON || github.event.inputs.fail_on || 'medium' }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    outputs:
      critical-found: ${{ steps.scan.outputs.critical-found }}
      high-found: ${{ steps.scan.outputs.high-found }}
      exit-code: ${{ steps.scan.outputs.exit-code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install laravel-security-scanner

      - name: Run security scan
        id: scan
        run: |
          # Set default values
          echo "CRITICAL_FOUND=0" >> $GITHUB_OUTPUT
          echo "HIGH_FOUND=0" >> $GITHUB_OUTPUT
          
          # Run scan and capture exit code
          laravel-sec-scanner "${{ env.TARGET_URL }}" \
            --format sarif \
            --output ./results \
            --fail-on ${{ env.FAIL_ON }} \
            --no-ssl-verify
          EXIT_CODE=$?
          echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Parse JSON results if available
          if [ -f ./results/*.json ]; then
            CRITICAL=$(cat ./results/*.json | jq -r '.critical_count // 0')
            HIGH=$(cat ./results/*.json | jq -r '.high_count // 0')
            echo "CRITICAL_FOUND=$CRITICAL" >> $GITHUB_OUTPUT
            echo "HIGH_FOUND=$HIGH" >> $GITHUB_OUTPUT
          fi
          
          # Show exit code
          echo "Scan exit code: $EXIT_CODE"

      - name: Upload SARIF to GitHub Security
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/*.sarif
          category: laravel-security-scan

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            results/*
          retention-days: 30

  report:
    needs: security-scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: reports

      - name: Summary
        run: |
          echo "## 🔒 Laravel Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Fail on:** ${{ env.FAIL_ON }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f reports/*.json ]; then
            echo "### Findings" >> $GITHUB_STEP_SUMMARY
            cat reports/*.json | jq -r '.findings[] | "- **\(.severity)**: \(.title)"' 2>/dev/null || true
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ needs.security-scan.outputs.exit-code }}" >> $GITHUB_STEP_SUMMARY

  # Optional: Add Jira issue on critical
  create-jira-issue:
    needs: security-scan
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create Jira issue
        uses: atlassian/gajira-create-from-v3@v3
        with:
          title: "Security Alert: Critical vulnerabilities found"
          description: "Critical vulnerabilities detected in ${{ env.TARGET_URL }}"
          issuetype: Bug
          project: SECURITY
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}