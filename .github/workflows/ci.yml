name: Laravel Security Scanner CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run tests
      run: pytest tests/ -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          reports/
          logs/

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install scanner
      run: pip install -e .

    - name: Verify scanner installation
      run: |
        which laravel-sec-scanner || echo "Scanner not found in PATH"
        laravel-sec-scanner --version || echo "Version check failed"
        python -m app.core.settings || true

    - name: Run security scan
      id: scan
      run: |
        mkdir -p results
        echo "Starting scan..."
        laravel-sec-scanner https://httpbin.org/html \
          --format sarif \
          --format json \
          --output ./results \
          --no-ssl-verify
        SCAN_EXIT=$?
        echo "Scan exit code: $SCAN_EXIT"
        echo "exit-code=$SCAN_EXIT" >> $GITHUB_OUTPUT
        
        echo "Directory contents:"
        ls -lah results/ || echo "Results directory not found"
        
        echo "All JSON files:"
        find results/ -type f -name "*.json" | head -20

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results/scan_*.sarif.json
        category: laravel-security-scan
        wait-for-processing: true

    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: results/
        retention-days: 30
