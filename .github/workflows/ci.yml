name: Laravel Security Scanner CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio

    - name: Run tests
      run: pytest tests/ -v

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install scanner
      run: pip install -e .

    - name: Debug info
      run: |
        echo "=== Python Version ==="
        python --version
        echo ""
        echo "=== Check if main.py exists ==="
        ls -la main.py
        echo ""
        echo "=== Check installed packages ==="
        pip list | grep -i laravel

    - name: Run scan
      id: scan
      run: |
        mkdir -p results
        echo "=== Starting Scanner ==="
        python main.py https://httpbin.org/html \
          --format all \
          --output ./results \
          --no-ssl-verify
        EXIT_CODE=$?
        echo "Exit code: $EXIT_CODE"
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
        
        echo ""
        echo "=== Results Directory ==="
        ls -lah results/ || echo "Directory empty"
        
        echo ""
        echo "=== All generated files ==="
        find results/ -type f 2>/dev/null || echo "No files found"

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results/scan_*.sarif.json
        category: laravel-security-scan

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: results/